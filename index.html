<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGS AND SONS - GST, ITR, Accounting Services Ludhiana</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #ffffff; color: #000; line-height: 1.6; }

        header {
            background: #000;
            color: white;
            padding: 15px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header .logo { display: flex; align-items: center; gap: 12px; }
        header .logo img { width: 45px; height: 45px; border-radius: 6px; object-fit: cover; border: 2px solid white; }
        header h1 { font-size: 24px; letter-spacing: 1px; }
        header nav a { color: white; text-decoration: none; margin-left: 25px; font-weight: 600; }
        header nav a:hover { text-decoration: underline; }

        .hero {
            background: #000;
            color: #fff;
            text-align: center;
            padding: 90px 20px;
        }
        .hero h2 { font-size: 42px; margin-bottom: 15px; }
        .hero p { font-size: 18px; margin-bottom: 30px; color: #ccc; }
        .btn {
            background: #fff;
            color: #000;
            padding: 15px 40px;
            border: 2px solid #fff;
            border-radius: 5px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover { background: #000; color: #fff; }
